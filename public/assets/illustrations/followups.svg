    <rect x="24" y="64" width="360" height="12" rx="6" fill="#e6fdf6" />
    <rect x="24" y="64" width="220" height="12" rx="6" fill="#20c997" />
    <text x="24" y="100" fill="#334155" font-size="14">3 of 5 follow-ups completed</text>

<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Follow ups illustration">
  <rect width="1200" height="500" rx="16" fill="#FEFEFF" />
  <g transform="translate(80,60)">
    <rect x="0" y="0" width="480" height="360" rx="12" fill="#ffffff" stroke="#EEF2FF" />
    <text x="24" y="36" fill="#0f172a" font-size="18" font-family="Inter, sans-serif">Follow-ups</text>
    <g transform="translate(24,64)">
      <rect x="0" y="0" width="420" height="56" rx="8" fill="#fff7ed" stroke="#ffedd5" />

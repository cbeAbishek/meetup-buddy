<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="480" viewBox="0 0 1200 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#ECFEFF" />
      <stop offset="1" stop-color="#F0FDFA" />
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1">
      <stop offset="0" stop-color="#EEFBF8" />
      <stop offset="1" stop-color="#E6FFFA" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="1200" height="480" rx="16" fill="#F8FAFC" />

  <!-- Left: Calendar card -->
  <g transform="translate(48,40)">
    <rect x="0" y="0" width="420" height="400" rx="12" fill="white" filter="url(#shadow)" />
    <rect x="20" y="18" width="380" height="44" rx="8" fill="#14B8A6" opacity="0.12" />
    <text x="36" y="48" font-family="Inter, Arial" font-size="16" fill="#0F172A" font-weight="700">Calendar</text>

    <!-- Weekday headers -->
    <g transform="translate(20,86)" font-family="Inter, Arial" font-size="12" fill="#475569">
      <text x="0" y="0">Sun</text>
      <text x="54" y="0">Mon</text>
      <text x="108" y="0">Tue</text>
      <text x="162" y="0">Wed</text>
      <text x="216" y="0">Thu</text>
      <text x="270" y="0">Fri</text>
      <text x="324" y="0">Sat</text>
    </g>

    <!-- Days grid -->
    <g transform="translate(20,104)">
      <!-- 6 rows x 7 cols small squares -->
      <!-- draw a few rows for visual -->
      <rect x="0" y="0" width="360" height="240" rx="8" fill="#F8FAFC" stroke="#E6EEF0" />

      <!-- sample highlighted day -->
      <g transform="translate(12,12)">
        <!-- day boxes -->
        <!-- row1 -->
        <rect x="0" y="0" width="48" height="48" rx="6" fill="#ffffff" />
        <rect x="56" y="0" width="48" height="48" rx="6" fill="#ffffff" />
        <rect x="112" y="0" width="48" height="48" rx="6" fill="#ffffff" />
        <rect x="168" y="0" width="48" height="48" rx="6" fill="#ffffff" />
        <rect x="224" y="0" width="48" height="48" rx="6" fill="#ffffff" />
        <rect x="280" y="0" width="48" height="48" rx="6" fill="#ffffff" />
        <rect x="336" y="0" width="48" height="48" rx="6" fill="#ffffff" />

        <!-- sample appointment on Wed (3rd box) -->
        <rect x="112" y="14" width="48" height="14" rx="4" fill="#14B8A6" opacity="0.18" />
        <text x="116" y="24" font-size="10" font-family="Inter, Arial" fill="#035A4A">10:00 • Sync</text>

        <!-- highlighted day with reminder badge -->
        <rect x="168" y="0" width="48" height="48" rx="6" fill="#ECFEFF" stroke="#14B8A6" />
        <text x="184" y="24" font-size="12" font-family="Inter, Arial" fill="#0F172A" font-weight="600">24</text>

        <!-- small dot indicator for reminders on other days -->
        <circle cx="36" cy="40" r="3" fill="#14B8A6" />
        <circle cx="92" cy="40" r="3" fill="#06B6D4" />
        <circle cx="212" cy="40" r="3" fill="#0EA5A4" />
      </g>
    </g>

    <!-- calendar footer legend -->
    <g transform="translate(20,364)" font-family="Inter, Arial" font-size="12" fill="#475569">
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#14B8A6" />
      <text x="18" y="9">Upcoming meetings</text>
      <rect x="150" y="0" width="10" height="10" rx="2" fill="#06B6D4" />
      <text x="168" y="9">Reminders</text>
    </g>
  </g>

  <!-- Middle: Agenda card -->
  <g transform="translate(520,40)">
    <rect x="0" y="0" width="420" height="400" rx="12" fill="white" filter="url(#shadow)" />
    <rect x="20" y="18" width="380" height="44" rx="8" fill="#065f59" opacity="0.08" />
    <text x="36" y="48" font-family="Inter, Arial" font-size="16" fill="#0F172A" font-weight="700">Auto Agenda</text>

    <g transform="translate(28,86)" font-family="Inter, Arial">
      <rect x="0" y="0" width="360" height="44" rx="8" fill="#F8FAFC" stroke="#E6EEF0" />
      <text x="12" y="28" font-size="14" fill="#0F172A">1. Review last meeting outcomes</text>

      <g transform="translate(0,64)">
        <rect x="0" y="0" width="360" height="220" rx="8" fill="#FBFFFE" stroke="#E6EEF0" />
        <!-- bullets -->
        <g transform="translate(12,12)" font-size="13" fill="#475569">
          <text y="0">• Follow up with Acme (owner: Alice)</text>
          <text y="24">• Q3 pipeline update (owner: Bob)</text>
          <text y="48">• Action items review</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Right: Follow-ups & quick actions -->
  <g transform="translate(980,40)">
    <rect x="0" y="0" width="160" height="400" rx="12" fill="white" filter="url(#shadow)" />
    <text x="16" y="40" font-family="Inter, Arial" font-size="14" fill="#0F172A" font-weight="700">Follow-ups</text>

    <g transform="translate(16,72)" font-family="Inter, Arial" font-size="13" fill="#475569">
      <rect x="0" y="0" width="128" height="36" rx="8" fill="#F8FAFC" stroke="#E6EEF0" />
      <text x="12" y="22">📌 Email client — Alice</text>
      <rect x="0" y="52" width="128" height="36" rx="8" fill="#F8FAFC" stroke="#E6EEF0" />
      <text x="12" y="74">✅ Prepare slides — Bob</text>
      <rect x="0" y="104" width="128" height="36" rx="8" fill="#F8FAFC" stroke="#E6EEF0" />
      <text x="12" y="126">🕒 Schedule follow-ups</text>
    </g>

    <!-- quick buttons -->
    <g transform="translate(16,260)">
      <rect x="0" y="0" width="128" height="40" rx="8" fill="#14B8A6" opacity="0.12" />
      <text x="16" y="26" font-family="Inter, Arial" font-size="13" fill="#035A4A">Create task</text>
    </g>
  </g>

  <!-- bottom badge row: platform logos (simplified circles) -->
  <g transform="translate(120,460)">
    <circle cx="0" cy="0" r="18" fill="#4285F4" />
    <circle cx="60" cy="0" r="18" fill="#6264A7" />
    <circle cx="120" cy="0" r="18" fill="#2D8CFF" />
    <circle cx="180" cy="0" r="18" fill="#4A154B" />
    <circle cx="240" cy="0" r="18" fill="#5865F2" />
    <circle cx="300" cy="0" r="18" fill="#00AB50" />
    <text x="360" y="4" font-family="Inter, Arial" font-size="12" fill="#475569">Integrations</text>
  </g>
</svg>

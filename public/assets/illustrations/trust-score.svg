<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Trust score illustration">
  <rect width="1200" height="600" rx="16" fill="#F7FFFB" />
  <g transform="translate(80,60)">
    <rect x="0" y="0" width="540" height="420" rx="14" fill="#fff" stroke="#E6F6F1" />
    <text x="28" y="36" fill="#0f172a" font-size="20" font-family="Inter, sans-serif">Trust score</text>
    <!-- Gauge -->
    <g transform="translate(40,80)">
      <path d="M220 140 A120 120 0 0 0 20 140" fill="#E6FFFA" stroke="#CFF6EE" stroke-width="2"/>
      <path d="M220 140 A120 120 0 0 0 80 140" fill="#20c997" stroke="#16a085" stroke-width="2"/>
      <circle cx="120" cy="140" r="6" fill="#0f172a" />
      <text x="100" y="90" fill="#0f172a" font-size="22">82</text>
      <text x="140" y="92" fill="#0f172a" font-size="12">/100</text>
    </g>
    <!-- Items showing contributors -->
    <g transform="translate(320,100)">
      <circle cx="24" cy="24" r="20" fill="#F0FFF9" />
      <text x="52" y="32" font-size="14" fill="#0f172a">Trustworthy follow-ups</text>
      <rect x="0" y="60" width="440" height="12" rx="6" fill="#E6FDF6" />
      <rect x="0" y="60" width="320" height="12" rx="6" fill="#20c997" />
      <text x="0" y="94" font-size="13" fill="#334155">Based on meeting history, completion rates & owner reliability</text>
    </g>
  </g>
</svg>
